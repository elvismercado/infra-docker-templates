# Media Stack

# Containers
# - Huntarr
# - Jellyfin
# - Seerr
# - Kavita
# - Gluetun
# - Transmission
# - FlareSolverr
# - Autobrr
# - Prowlarr
# - Lidarr
# - Readarr
# - Radarr
# - Sonarr
# - Recyclarr
# - Bazarr
# - Homarr

# This setup is for running in my Unraid server

name: ${CONTAINER_NAME_PREFIX:-media}

x-base-env: &base-env
  TZ: ${TZ:-Europe/London}
  UID: ${UID}
  GID: ${GID}
  PUID: ${UID}
  PGID: ${GID}
  UMASK: ${UMASK}

include:
  - networks.yml

services:

  jellyfin:
    extends:
      file: players/jellyfin.yml
      service: jellyfin
      
  seerr:
    extends:
      file: requests/seerr.yml
      service: seerr

  huntarr:
    extends:
      file: managers/utilities/huntarr.yml
      service: huntarr

  gluetun:
    extends:
      file: vpns/gluetun.yml
      service: gluetun
  nzbget:
    extends:
      file: downloaders/nzbget.yml
      service: nzbget
  transmission:
    extends:
      file: downloaders/transmission.yml
      service: transmission
  transmission-lat-team:
    extends:
      file: downloaders/transmission.yml
      service: transmission-lat-team

  flaresolverr:
    extends:
      file: indexers/flaresolverr.yml
      service: flaresolverr

  prowlarr:
    extends:
      file: indexers/prowlarr.yml
      service: prowlarr

  radarr-movies-hd:
    extends:
      file: managers/radarr.yml
      service: radarr-movies-hd
  radarr-movies-anime-hd:
    extends:
      file: managers/radarr.yml
      service: radarr-movies-anime-hd

  sonarr-series-hd:
    extends:
      file: managers/sonarr.yml
      service: sonarr-series-hd
  sonarr-series-anime-hd:
    extends:
      file: managers/sonarr.yml
      service: sonarr-series-anime-hd

  recyclarr:
    extends:
      file: managers/utilities/recyclarr.yml
      service: recyclarr

  # kavita:
