# https://hub.docker.com/r/linuxserver/readarr

x-base-env: &base-env
  TZ: ${TZ:-Europe/London}
  PUID: ${UID}
  PGID: ${GID}
  UMASK: ${UMASK}

services:
  # Books
  readarr-books:
    image: lscr.io/linuxserver/readarr:${READARR_VERSION:-develop}
    container_name: ${CONTAINER_NAME_PREFIX:-media}-readarr-books
    hostname: ${CONTAINER_NAME_PREFIX:-media}-readarr-books
    restart: always
    networks:
      - default
    volumes:
      - ${VOLUMES_BASE:-/tmp}/${CONTAINER_NAME_PREFIX:-media}/containers/readarr-books:/config
      - ${MEDIA_PATH}:/media
    ports:
      - ${READARR_BOOKS_HTTP_PORT:-8787}:8787 # WebUI
    environment:
      <<: *base-env
    depends_on:
      - prowlarr
    labels:
      - "com.service=${CONTAINER_NAME_PREFIX:-media}-readarr-books"

  # Audiobooks
  # Synced from readarr-books
  readarr-audiobooks:
    image: lscr.io/linuxserver/readarr:${READARR_VERSION:-develop}
    container_name: ${CONTAINER_NAME_PREFIX:-media}-readarr-audiobooks
    hostname: ${CONTAINER_NAME_PREFIX:-media}-readarr-audiobooks
    restart: always
    networks:
      - default
    volumes:
      - ${VOLUMES_BASE:-/tmp}/${CONTAINER_NAME_PREFIX:-media}/containers/readarr-audiobooks:/config
      - ${MEDIA_PATH}:/media
    ports:
      - ${READARR_AUDIOBOOKS_HTTP_PORT:-8788}:8787 # WebUI
    environment:
      <<: *base-env
    depends_on:
      - prowlarr
      - readarr-books
    labels:
      - "com.service=${CONTAINER_NAME_PREFIX:-media}-readarr-audiobooks"
