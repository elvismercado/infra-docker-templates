# https://hub.docker.com/r/linuxserver/kavita

x-base-env: &base-env
  TZ: ${TZ:-Europe/London}
  PUID: ${UID}
  PGID: ${GID}
  UMASK: ${UMASK}

services:
  kavita:
    image: lscr.io/linuxserver/kavita:${KAVITA_VERSION:-latest}
    container_name: ${CONTAINER_NAME_PREFIX:-media}-kavita
    hostname: ${CONTAINER_NAME_PREFIX:-media}-kavita
    restart: always
    networks:
      - default
    volumes:
      - ${VOLUMES_BASE:-/tmp}/${CONTAINER_NAME_PREFIX:-media}/containers/kavita:/config
      - ${MEDIA_PATH}:/media
    ports:
      - ${KAVITA_HTTP_PORT:-5000}:5000
    environment:
      <<: *base-env
    labels:
      - "com.service=${CONTAINER_NAME_PREFIX:-media}-kavita"