# https://github.com/ich777/docker-steamcmd-server/tree/vrising
# V Rising Dedicated Server

x-base-env: &base-env
  UID: ${UID:-99}
  GID: ${GID:-100}
  UMASK: ${UMASK:-022}
  TZ: ${TZ:-Europe/Amsterdam}

name: ${CONTAINER_NAME:-vrising}

networks:
  default:
    name: ${CONTAINER_NAME:-vrising}
    ipam:
      config:
        - subnet: ${SUBNET:-10.42.0.0/24}

services:
  vrising:
    image: ghcr.io/ich777/steamcmd:${IMAGE_VERSION:-vrising}
    container_name: ${CONTAINER_NAME:-vrising}
    hostname: ${CONTAINER_NAME:-vrising}
    restart: always
    stop_grace_period: 2m
    networks:
      - default
    ports:
      - "${GAME_PORT:-9876}:${GAME_PORT:-9876}/udp"
      - "${QUERY_PORT:-9877}:${QUERY_PORT:-9877}/udp"
    volumes:
      - ${VOLUMES_BASE:-/tmp}/${CONTAINER_NAME:-vrising}/steamcmd:/serverdata/steamcmd
      - ${VOLUMES_BASE:-/tmp}/${CONTAINER_NAME:-vrising}/serverfiles:/serverdata/serverfiles
      # Regenerates adminlist.txt from ADMIN_STEAM_IDS on start (ich777 hook).
      - ./scripts/adminlist-hook.sh:/opt/custom/user.sh:ro
    environment:
      <<: *base-env
      GAME_ID: ${GAME_ID:-1829350}
      SERVER_NAME: ${SERVER_NAME:-V Rising Docker}
      WORLD_NAME: ${WORLD_NAME:-friends-world}
      GAME_PARAMS: ${GAME_PARAMS:-}
      VALIDATE: ${VALIDATE:-false}
      ENABLE_BEPINEX: ${ENABLE_BEPINEX:-false}
      VR_SERVER_NAME: ${SERVER_NAME:-V Rising Docker}
      VR_DESCRIPTION: ${SERVER_DESCRIPTION:-Private server for friends}
      VR_GAME_PORT: ${GAME_PORT:-9876}
      VR_QUERY_PORT: ${QUERY_PORT:-9877}
      VR_HIDE_IP_ADDRESS: ${HIDE_IP_ADDRESS:-true}
      VR_MAX_USERS: ${MAX_CONNECTED_USERS:-10}
      VR_MAX_ADMINS: ${MAX_CONNECTED_ADMINS:-4}
      ADMIN_STEAM_IDS: ${ADMIN_STEAM_IDS:-}
      VR_FPS: ${SERVER_FPS:-30}
      VR_LOWER_FPS_WHEN_EMPTY: ${LOWER_FPS_WHEN_EMPTY:-true}
      VR_LOWER_FPS_WHEN_EMPTY_VALUE: ${LOWER_FPS_WHEN_EMPTY_VALUE:-5}
      VR_PASSWORD: ${SERVER_PASSWORD:-CHANGE_ME}
      VR_SECURE: ${SECURE:-true}
      VR_LIST_ON_STEAM: ${LIST_ON_STEAM:-true}
      VR_LIST_ON_EOS: ${LIST_ON_EOS:-true}
      VR_PRESET: ${GAME_SETTINGS_PRESET-StandardPvE}
      VR_DIFFICULTY_PRESET:
      VR_SAVE_NAME: ${WORLD_NAME:-friends-world}
      VR_SAVE_COUNT: ${AUTO_SAVE_COUNT:-30}
      VR_SAVE_INTERVAL: ${AUTO_SAVE_INTERVAL:-120}
      VR_AUTOSAVESMARTKEEP:
      VR_LAN_MODE:
      VR_RESET_DAYS_INTERVAL:
      VR_DAY_OF_RESET:
      VR_SAFE_RECONNECT_TIME:
      VR_SAFE_RECONNECT_SLOTS:
    healthcheck:
      test: ["CMD-SHELL", "pidof VRisingServer.exe >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20m
    labels:
      - "com.service=${CONTAINER_NAME:-vrising}"
