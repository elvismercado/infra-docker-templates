# Enable private RCON access; do not publish this port to the internet

services:
  vrising:
    ports:
      - "${RCON_HOST_ADDRESS:-127.0.0.1}:${RCON_PORT:-25575}:${RCON_PORT:-25575}/tcp"
    environment:
      VR_RCON_ENABLED: ${RCON_ENABLED:-true}
      VR_RCON_PORT: ${RCON_PORT:-25575}
      VR_RCON_PASSWORD: ${RCON_PASSWORD:-CHANGE_ME}
      VR_RCON_BIND_ADDRESS: ${RCON_BIND_ADDRESS:-0.0.0.0}