# WUD (What's Up Docker?) labels — notify + auto-update (same-tag digest updates)

services:
  searxng:
    labels:
      wud.watch: "true"
      wud.watch.digest: "true"
      wud.tag.include: '^$$'
      wud.trigger.include: "smtp.gmail,docker.local"

  valkey:
    labels:
      wud.watch: "true"
      wud.watch.digest: "true"
      wud.tag.include: '^$$'
      wud.trigger.include: "smtp.gmail,docker.local"
